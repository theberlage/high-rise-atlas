title: A High-Rise Atlas
description: The Berlage ProjectNL
credits: CREDITS.md
sources:
  high-rise-vision:
    type: geojson
    url: assets/geojson/high-rise-vision-2019.geojson

layers:
  - layer: high-rise-vision-fill
    visibility: none
  - layer: high-rise-vision-line
    visibility: none

slideshows:
  - id: main
    path: slideshows/introduction
    start:
      hideBasemap: true
      warpedMaps:
          - url: https://annotations.allmaps.org/manifests/7737cec074ed3ecf
            caption: Map of Rotterdam
            provenance: Rotterdam Municipal Works
            homepage: https://annotations.allmaps.org/manifests/7737cec074ed3ecf
            useBearing: true
            useZoom: true
  - id: district-1
    path: slideshows/district-1
  - id: district-2
    path: slideshows/district-2
  - id: district-3
    path: slideshows/district-3

# This key is for the template demo. When copying or forking this repository,
# get your own key at https://protomaps.com/api and replace it below.
protomaps:
  key: 4e19d5279de00d62
